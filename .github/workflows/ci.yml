name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pinboard_test
          POSTGRES_USER: pinboard_test
          POSTGRES_PASSWORD: pinboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinboard_test -d pinboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://pinboard_test:pinboard_test@127.0.0.1:5432/pinboard_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete checks
        run: npm run check

      - name: Run browser tests
        run: npm run test:e2e
